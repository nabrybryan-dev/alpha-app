# Gate de la app: tipos, linter y tests en cada push y cada PR.
#
# Por qué existe: Vercel despliega solo con hacer push a `main`, y hasta ahora
# nada comprobaba que los 242 tests pasaran antes de que el código llegara a los
# asesorados. Esto no bloquea el despliegue por sí solo (ver README): hace falta
# activar la protección de rama en GitHub para que un fallo aquí impida mezclar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la comprobación anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm ci` respeta los `overrides` a esbuild-wasm/@rollup/wasm-node que esta
      # máquina necesita por WDAC. Son más lentos, pero mantener CI y local con las
      # mismas versiones evita que un fallo aparezca solo en uno de los dos.
      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (tsc --strict)
        run: npm run typecheck

      - name: Linter (ESLint)
        run: npm run lint

      # Con cobertura y no `npm run test` a secas: así los umbrales-trinquete de
      # `vitest.config.ts` también son gate, no solo un informe local.
      - name: Tests con cobertura (vitest)
        run: npm run coverage

      - name: Instalar PostgreSQL en memoria para la firma de revisiones
        run: npm ci --prefix pruebas-sql --ignore-scripts

      - name: La firma respeta versión, permisos y aislamiento del archivo
        run: npm test --prefix pruebas-sql

  # ───────────────────────────────────────────────────────────────────────────
  # Lo que la suite de vitest NO puede ver.
  #
  # Los tests de la app corren siempre en modo demo (forzado en
  # `vitest.config.ts`), sin Supabase. Así que RLS, triggers, tipos y `ON
  # CONFLICT` quedaban sin ejercitar: un índice único parcial dejó el registro
  # de comidas sin subir nada durante semanas y ningún test podía verlo.
  #
  # Esto corre en los runners de GitHub, no en la máquina del equipo, así que la
  # restricción WDAC que obliga a `esbuild-wasm` aquí no aplica: se puede tener
  # un Postgres de verdad.
  #
  # Imagen con pgvector porque la 0010 (Centro de Respuestas) usa `vector`.
  base-de-datos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alpha_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alpha_pruebas

    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente de Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Vale por sí solo: hoy nadie comprueba que las migraciones corran seguidas
      # sobre una base vacía.
      - name: Aplicar migraciones desde cero
        run: bash scripts/aplicar-migraciones.sh

      - name: Las escrituras del asesorado llegan de verdad
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/10-escrituras-del-asesorado.sql

      - name: El aislamiento entre asesorados aguanta
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/20-aislamiento.sql

      - name: El molde de carga sabe cambiar el `cues`
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/30-molde-de-carga.sql

      - name: El cribado de salud se guarda de verdad
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/40-el-cribado-se-guarda.sql

      - name: Los errores del navegador se guardan y solo los lee el coach
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/60-los-errores-del-navegador.sql

      - name: La consola del coach respeta permisos por capacidad, no por rol
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/70-consola-permisos.sql

      - name: Reanudar y la firma de casos respetan su capacidad y su estado
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/80-consola-firma-y-reanudar.sql

      - name: La consola lee ficha y cribado por capacidad, y solo lee
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/90-consola-lee-ficha-y-cribado.sql

      - name: El primer plan lo aprueba quien puede, y al vencer solo pasa el riesgo bajo
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/95-consola-primer-plan.sql

      - name: El plan estratégico renovado lo aprueba quien puede, y el asesorado no ve su borrador
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/97-consola-plan-estrategico.sql

      - name: La tarjeta semanal y los mensajes de estilo de vida respetan quién es el dueño
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/100-tarjeta-vida-y-mensajes.sql

      - name: El tablero de creadores solo lo leen el coach y quien tiene revisar_creadores
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/110-creadores-tablero.sql

      - name: Las decisiones compartidas las anota quien tiene acceso, las firma solo el otro y no admiten salud
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/120-decisiones-compartidas.sql

      - name: Cada quien ve solo sus comentarios de la app y solo el coach los cierra
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/130-comentarios-app.sql

      - name: El buzón de mercadeo es de Manuela, y la regla vigente pide 3 referencias y la firma del coach
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/140-buzon-mercadeo.sql

      - name: La historia del embudo de creadores no acepta un carril inventado
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/150-creadores-eventos-carril.sql

      - name: El organizador de Bryan y Manuela guarda cada plan con su dueño, tope de 3 tareas por día y una sola principal
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/160-plan-items.sql

      - name: El registro de avisos push del organizador admite un aviso por tarea y día y solo lo escribe el servicio
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/170-avisos-plan-enviados.sql

      - name: Las vistas de comentarios y decisiones corren con los permisos de quien las lee, y cada rol ve lo mismo que antes
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/180-vistas-invoker.sql

      - name: Los avisos de seguridad (checkins_nutricion invoker, firmas sin anon) no cambian lo que ve cada rol
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/190-avisos-seguridad.sql

      - name: El tablero del área administrativa lo lee quien tiene la capacidad, no lo escribe nadie con sesión y anon no ve nada
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/test/200-admin-tablero.sql
