<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800;125,900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; background: #08090a; }
    a { color: #ff1e1e; } a:hover { color: #c8121a; }
  </style>

  <style>
    /* LOS CINCO PESOS, tal cual salen de `scripts/generar-muelles.mjs`: muelles
       amortiguados muestreados, no Béziers tanteadas. Lo pesado se asienta y NO
       rebota; lo ligero llega al 110 % y vuelve. */
    :root {
      --dur-protagonista: 455ms;
      --dur-informativo: 542ms;
      --dur-transicional: 471ms;
      --dur-ambiental: 792ms;
      --dur-microinteraccion: 459ms;
      --muelle-protagonista: linear(0, 0.0106, 0.039, 0.0802, 0.1305, 0.1868, 0.2464, 0.3074, 0.3681, 0.4275, 0.4846, 0.5388, 0.5897, 0.637, 0.6806, 0.7205, 0.7567, 0.7893, 0.8186, 0.8447, 0.8679, 0.8883, 0.9062, 0.9218, 0.9353, 0.947, 0.957, 0.9655, 0.9728, 0.9789, 0.9839, 0.9882, 0.9916, 0.9945, 1);
      --muelle-informativo: linear(0, 0.0215, 0.0763, 0.1523, 0.2403, 0.333, 0.4254, 0.5137, 0.5957, 0.6698, 0.7354, 0.7923, 0.8408, 0.8814, 0.9148, 0.9418, 0.9631, 0.9797, 0.9922, 1.0013, 1.0076, 1.0118, 1.0142, 1.0154, 1.0156, 1.0151, 1.0141, 1.0129, 1.0115, 1.01, 1.0086, 1.0072, 1.006, 1.0049, 1);
      --muelle-transicional: linear(0, 0.0204, 0.0724, 0.1444, 0.2276, 0.3154, 0.403, 0.4871, 0.5655, 0.637, 0.7008, 0.7569, 0.8053, 0.8466, 0.8814, 0.9101, 0.9337, 0.9527, 0.9677, 0.9795, 0.9885, 0.9952, 1.0001, 1.0034, 1.0057, 1.007, 1.0077, 1.0079, 1.0077, 1.0072, 1.0067, 1.006, 1.0053, 1.0046, 1);
      --muelle-ambiental: linear(0, 0.0137, 0.0494, 0.1, 0.1602, 0.2258, 0.2936, 0.3612, 0.4269, 0.4896, 0.5483, 0.6027, 0.6526, 0.6979, 0.7386, 0.7749, 0.8072, 0.8356, 0.8606, 0.8823, 0.9011, 0.9174, 0.9313, 0.9433, 0.9534, 0.962, 0.9692, 0.9752, 0.9802, 0.9844, 0.9878, 0.9906, 0.9929, 0.9948, 1);
      --muelle-microinteraccion: linear(0, 0.0342, 0.1217, 0.2421, 0.3784, 0.5173, 0.6492, 0.7673, 0.8679, 0.9492, 1.0113, 1.0555, 1.0839, 1.0989, 1.1034, 1.0999, 1.0909, 1.0785, 1.0644, 1.05, 1.0364, 1.0241, 1.0137, 1.0053, 0.9989, 0.9943, 0.9913, 0.9898, 0.9893, 0.9897, 0.9906, 0.9919, 0.9933, 0.9948, 1);
    }

    @keyframes muro-entra { from { opacity: 0; transform: translateY(14px); } }
    @keyframes muro-junta-traza { from { transform: scaleX(0); opacity: 0; } }
    @keyframes muro-palabra-entra { from { opacity: 0; transform: translateY(0.5em); } }
    @keyframes muro-aliento { 0%, 100% { opacity: 0.82; } 50% { opacity: 1; } }
    @keyframes muro-cifra-rueda {
      0%, 86% { opacity: 1; transform: translateY(0); text-shadow: 0 0 0.5em rgba(255,30,30,0.45); }
      88% { opacity: 0; transform: translateY(0.42em); }
      90% { opacity: 0; transform: translateY(-0.42em); text-shadow: 0 0 1.4em rgba(255,30,30,0.95); }
      100% { opacity: 1; transform: translateY(0); text-shadow: 0 0 0.5em rgba(255,30,30,0.45); }
    }
    @keyframes muro-testigo { 0%, 100% { opacity: 0.34; } 50% { opacity: 1; } }
    @keyframes muro-ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    .m-entra { animation: muro-entra var(--dur-protagonista) var(--muelle-protagonista) both; }
    .m-junta { transform-origin: center; animation: muro-junta-traza var(--dur-transicional) var(--muelle-transicional) both; }
    .m-palabra { display: inline-block; animation: muro-palabra-entra var(--dur-informativo) var(--muelle-informativo) both; }
    .m-aliento { animation: muro-aliento 9s var(--muelle-ambiental) infinite; }
    .m-cifra { display: inline-block; animation: muro-cifra-rueda 7s var(--muelle-microinteraccion) infinite; }
    .m-testigo { animation: muro-testigo 1.6s var(--muelle-ambiental) infinite; }
    .m-ticker { display: inline-flex; white-space: nowrap; animation: muro-ticker 17s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .m-entra, .m-junta, .m-palabra, .m-cifra, .m-aliento, .m-testigo, .m-ticker { animation: none; }
    }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 560px; overflow: hidden; background: #08090a; color: #f4f5f6;">

  <!-- El muro y el suelo. El reflector está APOYADO EN EL SUELO, que es donde se planta
       el trípode, así que hace falta ver dónde acaba la pared para que el cono se lea. -->
  <div style="position: absolute; left: 0; right: 0; top: 430px; height: 1px; background: linear-gradient(90deg, transparent, rgba(111,119,130,0.4) 18%, rgba(111,119,130,0.4) 82%, transparent);"></div>
  <div style="position: absolute; left: 0; right: 0; top: 431px; bottom: 0; background: linear-gradient(to bottom, #0b0c0e, #000);"></div>

  <!-- EL CONO. Nace estrecho abajo —junto a la fuente— y se ensancha subiendo por la
       pared. El primer intento lo tenía del revés y se leía como un embudo colgado del
       techo, que es otra cosa y encima no está ahí. -->
  <div class="m-aliento" style="position: absolute; left: 26px; top: 40px; width: 338px; height: 392px; clip-path: polygon(0% 0%, 100% 0%, 64% 100%, 36% 100%); background: linear-gradient(to top, rgba(111,119,130,0.05), rgba(111,119,130,0.19) 52%, rgba(111,119,130,0.24) 88%), radial-gradient(64% 46% at 50% 4%, rgba(255,30,30,0.18), transparent 72%);"></div>

  <!-- El trípode de verdad, al pie: es geometría en la escena, y el módulo es su mando.
       Se dibuja aquí para que se vea de dónde sale la luz. -->
  <svg viewBox="0 0 60 96" style="position: absolute; left: 165px; top: 336px; width: 60px; height: 96px;" aria-hidden="true">
    <g stroke="#3a3f45" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M30 40 V62" /><path d="M30 62 L12 92 M30 62 L48 92 M30 62 V92" />
    </g>
    <rect x="16" y="20" width="28" height="19" rx="3" fill="#15181b" stroke="#4a5057" stroke-width="1.6" />
    <path d="m44 26 9-4v14l-9-4z" fill="#15181b" stroke="#4a5057" stroke-width="1.6" stroke-linejoin="round" />
    <circle cx="23" cy="29" r="4" fill="none" stroke="#6f7782" stroke-width="1.4" />
  </svg>

  <!-- LA CABECERA DEL REFLECTOR, dentro del cono: el aparato, el rótulo serigrafiado y
       el testigo de grabación encendido. -->
  <div class="m-entra" style="position: absolute; left: 68px; top: 74px; width: 254px; display: flex; flex-direction: column; gap: 13px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg viewBox="0 0 24 26" width="24" height="26" fill="none" stroke="#ff1e1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 6px rgba(255,30,30,0.5)); flex-shrink: 0;">
        <path d="M12 12v6" /><path d="M12 18 6 25M12 18l6 7M12 18v7" />
        <rect x="4" y="4" width="12" height="8" rx="1.5" /><path d="m16 7 4-2v6l-4-2" />
      </svg>
      <span style="font-size: 9px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #6f7782;">Cámara del encuadre</span>
      <span class="m-testigo" style="margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #ff1e1e; box-shadow: 0 0 9px rgba(255,30,30,0.8); flex-shrink: 0;"></span>
    </div>

    <!-- El encuadre de hoy, dicho en la pared y no en una ficha: desde dónde mira el
         móvil y a qué distancia. Son los datos que se leen JUNTO AL TRÍPODE, agachado,
         con el teléfono en la mano — por eso están aquí y no en la esquina opuesta. -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 8px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #6f7782;">Móvil</span>
        <span style="font-size: 12.5px; font-weight: 600; line-height: 1.2; color: #f4f5f6; text-shadow: 0 0 7px rgba(111,119,130,0.55);">De perfil</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-size: 8px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #6f7782;">Distancia</span>
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; font-weight: 500; line-height: 1.2; color: #f4f5f6; text-shadow: 0 0 7px rgba(111,119,130,0.55); font-variant-numeric: tabular-nums;">3,0 m · lente 1,0 m</span>
      </div>
    </div>

    <hr class="m-junta" style="height: 1px; border: 0; margin: 0; animation-delay: 300ms; background: linear-gradient(90deg, transparent, rgba(255,30,30,0.75) 14%, rgba(255,30,30,0.30) 62%, transparent);">

    <!-- EL MANDO, recogido a su texto. A ancho completo era una barra de interfaz
         cruzando la pared; así es un aparato colgado bajo el rótulo. -->
    <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 9px; padding: 11px 17px; border: 0; border-radius: 2px; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #f4f5f6; cursor: pointer; background: linear-gradient(180deg, rgba(15,17,19,0.96), rgba(0,0,0,0.96)); box-shadow: inset 0 1px 0 rgba(111,119,130,0.45), inset 0 -1px 0 rgba(0,0,0,0.9), 0 9px 20px -9px rgba(0,0,0,0.95);">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ff1e1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7h4l2-2h6l2 2h4v12H3z" /><circle cx="12" cy="13" r="3.6" />
      </svg>
      Medir con la cámara
    </button>
  </div>

  <!-- La marca del suelo: el cono de tolerancia del encoder, que no es adorno — son los
       30° que se dan por buenos si se ve un disco. -->
  <svg viewBox="0 0 390 130" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 130px;" aria-hidden="true">
    <path d="M195 8 L96 122 H294 Z" fill="rgba(255,30,30,0.05)" stroke="rgba(255,30,30,0.28)" stroke-width="1" />
    <path d="M195 8 V122" stroke="rgba(255,30,30,0.18)" stroke-width="1" stroke-dasharray="4 6" />
  </svg>
</div>
</x-dc>
</body>
</html>
