<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=JetBrains+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; background: #0b0e12; color: #f2f2f2; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    a { color: #ff1e1e; } a:hover { color: #8f1119; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; }
    .display { font-family: 'Archivo', Impact, system-ui, sans-serif; font-stretch: 125%; font-weight: 900; text-transform: uppercase; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 560px; overflow: hidden; background: #0b0e12;">
  <svg width="390" height="560" viewBox="0 300 390 560" style="position: absolute; left: 0; top: 0;" aria-label="Dirección C: el vector de la carga, con el frenado">
    <defs>
      <radialGradient id="brasaC" cx="0.5" cy="0.10" r="0.45">
        <stop offset="0" stop-color="#7a1418" stop-opacity="0.7"></stop>
        <stop offset="1" stop-color="#0b0e12" stop-opacity="0"></stop>
      </radialGradient>
      <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 0 L10 5 L0 10 Z" fill="#f5a623"></path>
      </marker>
    </defs>
    <rect y="300" width="390" height="560" fill="#0b0e12"></rect>
    <rect y="300" width="390" height="560" fill="url(#brasaC)"></rect>
    <path d="M0 260 L38 292 L38 700 L0 720 Z" fill="#141a20" opacity="0.9"></path>
    <path d="M390 260 L352 292 L352 700 L390 720 Z" fill="#141a20" opacity="0.9"></path>
    <path d="M0 720 L390 720 L390 860 L0 860 Z" fill="#0d1116"></path>
    <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
      <line x1="0" y1="700" x2="390" y2="700"></line>
      <line x1="0" y1="728" x2="390" y2="728"></line>
      <line x1="0" y1="764" x2="390" y2="764"></line>
      <line x1="0" y1="810" x2="390" y2="810"></line>
      <line x1="195" y1="560" x2="195" y2="860"></line>
      <line x1="195" y1="560" x2="60" y2="860"></line>
      <line x1="195" y1="560" x2="330" y2="860"></line>
    </g>
    <rect x="128" y="440" width="176" height="14" fill="#6b7178"></rect>
    <rect x="128" y="474" width="176" height="18" fill="#7d838a"></rect>
    <rect x="152" y="404" width="52" height="38" fill="#c9cfd5"></rect>
    <rect x="236" y="404" width="52" height="38" fill="#c9cfd5"></rect>
    <line x1="96" y1="536" x2="96" y2="700" stroke="#e6e6e6" stroke-width="1.5" opacity="0.75"></line>
    <line x1="300" y1="536" x2="300" y2="700" stroke="#e6e6e6" stroke-width="1.5" opacity="0.75"></line>

    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g stroke="#cfc4b4" stroke-width="15">
        <line x1="150" y1="690" x2="205" y2="690"></line>
        <line x1="185" y1="690" x2="240" y2="600"></line>
        <line x1="240" y1="600" x2="170" y2="560"></line>
        <line x1="170" y1="560" x2="215" y2="430"></line>
        <line x1="215" y1="430" x2="245" y2="470"></line>
        <line x1="245" y1="470" x2="235" y2="505"></line>
      </g>
      <g stroke="#e8e0d3" stroke-width="5" opacity="0.9">
        <line x1="185" y1="690" x2="240" y2="600"></line>
        <line x1="240" y1="600" x2="170" y2="560"></line>
        <line x1="170" y1="560" x2="215" y2="430"></line>
        <line x1="215" y1="430" x2="245" y2="470"></line>
      </g>
      <circle cx="228" cy="402" r="17" fill="#cfc4b4" stroke="none"></circle>
      <circle cx="235" cy="505" r="13" fill="#2a2d31" stroke="#8a8f95" stroke-width="2"></circle>
      <rect x="229" y="484" width="12" height="10" rx="2" fill="#5a5f66" stroke="none"></rect>
    </g>

    <!-- EL VECTOR DE LA CARGA: m·(g+a). El tramo del peso, sólido; el del frenado, encima. -->
    <line x1="235" y1="600" x2="235" y2="690" stroke="#f5a623" stroke-width="2" stroke-dasharray="7 6" opacity="0.6"></line>
    <line x1="235" y1="518" x2="235" y2="574" stroke="#f5a623" stroke-width="3.5"></line>
    <line x1="235" y1="574" x2="235" y2="596" stroke="#f5a623" stroke-width="3.5" stroke-dasharray="3 3" marker-end="url(#punta)"></line>
    <line x1="229" y1="574" x2="241" y2="574" stroke="#f5a623" stroke-width="1.4"></line>
    <circle cx="235" cy="690" r="3" fill="#f5a623"></circle>

    <!-- Los brazos, como en A pero sin cifras: el vector ya dice cuánto tira. -->
    <g stroke="#ff1e1e" stroke-width="1.6">
      <line x1="170" y1="560" x2="235" y2="560"></line>
      <line x1="240" y1="600" x2="235" y2="600"></line>
    </g>
    <circle cx="170" cy="560" r="3.2" fill="#ff1e1e"></circle>
    <circle cx="240" cy="600" r="3.2" fill="#ff1e1e"></circle>
  </svg>
  <div class="mono" style="position: absolute; left: 247px; top: 268px; font-size: 10.5px; letter-spacing: 0.06em; color: #f5a623;">1,3<span style="opacity: 0.7; font-size: 8.5px; margin-left: 2px;">G</span></div>
  <div style="position: absolute; left: 22px; top: 16px; display: flex; flex-direction: column; gap: 3px;">
    <span class="display" style="font-size: 12px; color: #f2f2f2;">C · Vector de carga</span>
    <span class="mono" style="font-size: 9px; letter-spacing: 0.12em; color: #a8a8ad;">PESO + FRENADO · SE ALARGA AL FRENAR</span>
  </div>
</div>
</x-dc>
</body>
</html>
