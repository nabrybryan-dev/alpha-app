<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Hanken+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; background: #0b0e12; font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #f2f2f2; }
    a { color: #ff1e1e; } a:hover { color: #8f1119; }
    .trazo { font-family: 'Archivo', Impact, system-ui, sans-serif; font-stretch: 125%; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.9; color: transparent; -webkit-text-stroke: 1.1px rgba(242,242,242,0.62); }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; }
    .display { font-family: 'Archivo', Impact, system-ui, sans-serif; font-stretch: 125%; font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0b0e12;">
  <svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0;" aria-label="Salón: sentadilla goblet en el fondo, con el brazo de momento dibujado">
    <defs>
      <radialGradient id="brasa" cx="0.5" cy="0.36" r="0.40">
        <stop offset="0" stop-color="#7a1418" stop-opacity="0.85"></stop>
        <stop offset="1" stop-color="#0b0e12" stop-opacity="0"></stop>
      </radialGradient>
      <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
    </defs>
    <rect width="390" height="844" fill="#0b0e12"></rect>
    <rect width="390" height="844" fill="url(#brasa)"></rect>
    <!-- Tablón de la pared -->
    <text x="195" y="236" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="46" letter-spacing="7" fill="#ff1e1e" opacity="0.22" filter="url(#brillo)">03 12 2 03</text>
    <text x="195" y="236" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="46" letter-spacing="7" fill="#ff1e1e" opacity="0.55">03 12 2 03</text>
    <!-- Paredes laterales -->
    <path d="M0 260 L38 292 L38 700 L0 720 Z" fill="#141a20" opacity="0.9"></path>
    <path d="M390 260 L352 292 L352 700 L390 720 Z" fill="#141a20" opacity="0.9"></path>
    <!-- Suelo en perspectiva -->
    <path d="M0 720 L390 720 L390 844 L0 844 Z" fill="#0d1116"></path>
    <g stroke="rgba(255,255,255,0.10)" stroke-width="1">
      <line x1="0" y1="700" x2="390" y2="700"></line>
      <line x1="0" y1="728" x2="390" y2="728"></line>
      <line x1="0" y1="764" x2="390" y2="764"></line>
      <line x1="0" y1="810" x2="390" y2="810"></line>
      <line x1="195" y1="560" x2="195" y2="844"></line>
      <line x1="195" y1="560" x2="60" y2="844"></line>
      <line x1="195" y1="560" x2="330" y2="844"></line>
      <line x1="195" y1="560" x2="-80" y2="844"></line>
      <line x1="195" y1="560" x2="470" y2="844"></line>
    </g>
    <!-- Banco de la sala -->
    <rect x="128" y="440" width="176" height="14" fill="#6b7178"></rect>
    <rect x="128" y="474" width="176" height="18" fill="#7d838a"></rect>
    <rect x="152" y="404" width="52" height="38" fill="#c9cfd5"></rect>
    <rect x="236" y="404" width="52" height="38" fill="#c9cfd5"></rect>
    <!-- Postes de la estación -->
    <line x1="96" y1="536" x2="96" y2="700" stroke="#e6e6e6" stroke-width="1.5" opacity="0.75"></line>
    <line x1="300" y1="536" x2="300" y2="700" stroke="#e6e6e6" stroke-width="1.5" opacity="0.75"></line>

    <!-- EL SUJETO: sentadilla goblet, fondo, de perfil -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g stroke="#cfc4b4" stroke-width="15">
        <line x1="150" y1="690" x2="205" y2="690"></line>
        <line x1="185" y1="690" x2="240" y2="600"></line>
        <line x1="240" y1="600" x2="170" y2="560"></line>
        <line x1="170" y1="560" x2="215" y2="430"></line>
        <line x1="215" y1="430" x2="245" y2="470"></line>
        <line x1="245" y1="470" x2="235" y2="505"></line>
      </g>
      <g stroke="#e8e0d3" stroke-width="5" opacity="0.9">
        <line x1="185" y1="690" x2="240" y2="600"></line>
        <line x1="240" y1="600" x2="170" y2="560"></line>
        <line x1="170" y1="560" x2="215" y2="430"></line>
        <line x1="215" y1="430" x2="245" y2="470"></line>
      </g>
      <circle cx="228" cy="402" r="17" fill="#cfc4b4" stroke="none"></circle>
      <!-- La goblet en las manos -->
      <circle cx="235" cy="505" r="13" fill="#2a2d31" stroke="#8a8f95" stroke-width="2"></circle>
      <rect x="229" y="484" width="12" height="10" rx="2" fill="#5a5f66" stroke="none"></rect>
    </g>

    <!-- LA PLOMADA: la vertical de la carga. Ya existe en la sala. -->
    <line x1="235" y1="518" x2="235" y2="690" stroke="#f5a623" stroke-width="2" stroke-dasharray="7 6" opacity="0.95"></line>
    <circle cx="235" cy="690" r="3" fill="#f5a623"></circle>

    <!-- LOS BRAZOS DE MOMENTO: la distancia horizontal de cada eje a la plomada. -->
    <g stroke="#ff1e1e" stroke-width="1.6">
      <line x1="170" y1="560" x2="235" y2="560"></line>
      <line x1="170" y1="555" x2="170" y2="565"></line>
      <line x1="240" y1="600" x2="235" y2="600"></line>
      <line x1="240" y1="595" x2="240" y2="605"></line>
    </g>
    <!-- LOS ARCOS DE PAR: el barrido crece con el brazo. -->
    <path d="M 148 560 A 22 22 0 0 1 170 538" stroke="#ff1e1e" stroke-width="2.4" fill="none" opacity="0.9"></path>
    <path d="M 148 560 A 22 22 0 0 1 170 538" stroke="#ff1e1e" stroke-width="7" fill="none" opacity="0.18" filter="url(#brillo)"></path>
    <path d="M 240 578 A 22 22 0 0 1 244 578.4" stroke="#ff1e1e" stroke-width="2.4" fill="none" opacity="0.9"></path>
    <circle cx="170" cy="560" r="3.2" fill="#ff1e1e"></circle>
    <circle cx="240" cy="600" r="3.2" fill="#ff1e1e"></circle>
  </svg>

  <!-- Las cifras: una por eje, pegadas al brazo, en la letra más pequeña del salón. -->
  <sc-if value="{{cifras}}" hint-placeholder-val="{{ true }}">
    <div class="mono" style="position: absolute; left: 176px; top: 543px; font-size: 10.5px; letter-spacing: 0.04em; color: #ff1e1e;">18<span style="opacity: 0.65; font-size: 8.5px; margin-left: 2px;">CM</span></div>
    <div class="mono" style="position: absolute; left: 248px; top: 589px; font-size: 10.5px; letter-spacing: 0.04em; color: #ff1e1e;">1<span style="opacity: 0.65; font-size: 8.5px; margin-left: 2px;">CM</span></div>
  </sc-if>

  <!-- Cabecera del salón -->
  <div style="position: absolute; left: 22px; top: 44px; display: flex; gap: 6px; align-items: baseline;">
    <span class="display" style="font-size: 15px; color: #f2f2f2;">Sesión</span>
    <span class="display" style="font-size: 15px; color: #a8a8ad;">Full C</span>
  </div>
  <div class="mono" style="position: absolute; right: 22px; top: 48px; font-size: 11px; letter-spacing: 0.12em; color: #ff1e1e;">VIERNES ◇</div>
  <div class="mono" style="position: absolute; left: 58px; top: 76px; font-size: 8.5px; letter-spacing: 0.18em; color: #a8a8ad;">SALA 05</div>
  <div class="trazo" style="position: absolute; left: 58px; top: 88px; font-size: 25px; width: 190px;">Sentadilla goblet</div>
  <div class="mono" style="position: absolute; right: 26px; top: 90px; font-size: 8.5px; letter-spacing: 0.18em; color: #a8a8ad; text-align: right;">SESIÓN</div>
  <div class="mono" style="position: absolute; right: 26px; top: 102px; font-size: 17px; letter-spacing: 0.06em; color: #f2f2f2;">00:00:04</div>
  <div style="position: absolute; left: 22px; top: 128px; width: 346px; height: 1px; background: linear-gradient(90deg, rgba(255,30,30,0.9), rgba(255,30,30,0));"></div>

  <!-- Mandos redondos -->
  <div style="position: absolute; left: 326px; top: 580px; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #ff1e1e; background: rgba(11,14,18,0.7); display: flex; align-items: center; justify-content: center;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff1e1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
  </div>
  <div style="position: absolute; left: 326px; top: 642px; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #f2f2f2; background: rgba(11,14,18,0.7); display: flex; align-items: center; justify-content: center;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f2f2f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6"></path></svg>
  </div>

  <!-- Puntos de ejercicio y tirador -->
  <div style="position: absolute; left: 0; right: 0; top: 708px; display: flex; gap: 6px; justify-content: center; align-items: center;">
    <div style="width: 14px; height: 4px; border-radius: 2px; background: #ff1e1e;"></div>
    <div style="width: 4px; height: 4px; border-radius: 2px; background: #4a4a4d;"></div>
    <div style="width: 4px; height: 4px; border-radius: 2px; background: #4a4a4d;"></div>
    <div style="width: 4px; height: 4px; border-radius: 2px; background: #4a4a4d;"></div>
    <div style="width: 4px; height: 4px; border-radius: 2px; background: #4a4a4d;"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 740px; height: 40px; border-radius: 22px 22px 0 0; background: rgba(20,20,20,0.92); display: flex; justify-content: center; padding-top: 8px;">
    <div style="width: 44px; height: 3px; border-radius: 2px; background: #4a4a4d;"></div>
  </div>

  <!-- Barra de navegación -->
  <div style="position: absolute; left: 14px; right: 14px; top: 768px; height: 62px; border-radius: 31px; background: #141414; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-around; padding: 0 8px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2f2f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"></path></svg><span class="display" style="font-size: 8.5px; color: #f2f2f2;">Hoy</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff1e1e" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h3M18 12h3M6 8v8M18 8v8M9 6v12M15 6v12M9 12h6"></path></svg><span class="display" style="font-size: 8.5px; color: #ff1e1e;">Entrenar</span><div style="width: 3px; height: 3px; border-radius: 50%; background: #ff1e1e;"></div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2f2f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg><span class="display" style="font-size: 8.5px; color: #f2f2f2;">Bienestar</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2f2f2" stroke-width="1.8" stroke-linecap="round"><path d="M7 3v8M10 3v8M7 11v10M16 3c-2 2-2 6 0 8v10M13 7c0 3 3 3 3 3"></path></svg><span class="display" style="font-size: 8.5px; color: #f2f2f2;">Nutrición</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2f2f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"></path></svg><span class="display" style="font-size: 8.5px; color: #f2f2f2;">Progreso</span></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"cifras":{"editor":"boolean","default":true,"section":"Letra"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { cifras: this.props.cifras ?? true };
  }
}
</script>
</body>
</html>
