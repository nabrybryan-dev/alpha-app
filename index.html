<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- El monograma, que es la marca que aguanta 16 px. Sale del propio
         icon-512 recortado al trazo: con el margen del icono PWA se embarra
         en la pestaña. Lo que había aquí era un marcador de posición con una
         «A» en Arial Black, que no es de Alpha. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Design system Alfa Athletics (handoff): display Archivo (expandido),
         UI Hanken Grotesk, datos JetBrains Mono.

         Una sola hoja y un solo origen a propósito. Hasta el 2026-08-19 había
         tres hojas y dos orígenes: sobraban Inter y Satoshi, de la identidad
         anterior, que solo figuraban como respaldo en las pilas y por tanto no
         se pintaban nunca. Eran 188 KB en 5 archivos —141 de Inter, 47 de
         Satoshi— descargados para no verse, más el handshake de fontshare.
         Antes de añadir otra hoja aquí: si la fuente no hace falta en el primer
         pintado, va con `cargarFuentesDelGabinete`, no en este head. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800;125,900&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Alpha Athletics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
